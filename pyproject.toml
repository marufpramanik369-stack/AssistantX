# ============================================================================
# AssistantX - Python Project Configuration
# ============================================================================
#
# This file contains modern Python project metadata, build configuration,
# dependency groups, Ruff configuration, pytest configuration and mypy
# configuration.
#
# Python: 3.10+
#
# ============================================================================


# ============================================================================
# 01. BUILD SYSTEM
# ============================================================================

[build-system]

requires = [
    "setuptools>=69.0",
    "wheel>=0.43.0",
]

build-backend = "setuptools.build_meta"


# ============================================================================
# 02. PROJECT METADATA
# ============================================================================

[project]

name = "assistantx"

version = "1.0.0"

description = "A modular, extensible and intelligent desktop AI assistant built with Python."

readme = "README.md"

requires-python = ">=3.10"

license = { file = "LICENSE" }

authors = [
    { name = "MP.Maruf Khan" },
]

keywords = [
    "assistant",
    "ai",
    "artificial-intelligence",
    "desktop-assistant",
    "voice-assistant",
    "automation",
    "gemini",
    "ollama",
    "local-ai",
    "productivity",
    "python",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    # Environment
    "python-dotenv>=1.0.1,<2.0.0",

    # AI providers
    "google-genai>=1.0.0,<2.0.0",
    "ollama>=0.4.0,<1.0.0",
    "openai>=1.50.0,<2.0.0",

    # AI / ML
    "numpy>=1.26.0,<3.0.0",
    "scikit-learn>=1.4.0,<2.0.0",

    # HTTP / web
    "requests>=2.32.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",

    # Information services
    "wikipedia>=1.4.0,<2.0.0",

    # Voice
    "SpeechRecognition>=3.10.0,<4.0.0",
    "PyAudio>=0.2.14,<1.0.0",
    "pyttsx3>=2.90,<3.0.0",
    "sounddevice>=0.5.0,<1.0.0",
    "soundfile>=0.12.0,<1.0.0",

    # Desktop automation
    "PyAutoGUI>=0.9.54,<1.0.0",
    "pyperclip>=1.9.0,<2.0.0",
    "Pillow>=10.4.0,<13.0.0",

    # Notifications
    "plyer>=2.1.0,<3.0.0",

    # Music
    "spotipy>=2.24.0,<3.0.0",

    # Database / models
    "SQLAlchemy>=2.0.0,<3.0.0",
    "pydantic>=2.8.0,<3.0.0",

    # Scheduler
    "APScheduler>=3.10.0,<4.0.0",

    # Async
    "anyio>=4.4.0,<5.0.0",
]


# ============================================================================
# 03. PROJECT URLS
# ============================================================================

[project.urls]

Homepage = "https://github.com/YOUR_USERNAME/AssistantX"

Documentation = "https://github.com/YOUR_USERNAME/AssistantX/tree/main/docs"

Repository = "https://github.com/YOUR_USERNAME/AssistantX"

Issues = "https://github.com/YOUR_USERNAME/AssistantX/issues"

Changelog = "https://github.com/YOUR_USERNAME/AssistantX/blob/main/docs/changelog.md"


# ============================================================================
# 04. OPTIONAL DEPENDENCIES
# ============================================================================

[project.optional-dependencies]


# ---------------------------------------------------------------------------
# AI
# ---------------------------------------------------------------------------

ai = [
    "google-genai>=1.0.0,<2.0.0",
    "ollama>=0.4.0,<1.0.0",
    "openai>=1.50.0,<2.0.0",
    "numpy>=1.26.0,<3.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
]


# ---------------------------------------------------------------------------
# Voice
# ---------------------------------------------------------------------------

voice = [
    "SpeechRecognition>=3.10.0,<4.0.0",
    "PyAudio>=0.2.14,<1.0.0",
    "pyttsx3>=2.90,<3.0.0",
    "sounddevice>=0.5.0,<1.0.0",
    "soundfile>=0.12.0,<1.0.0",
]


# ---------------------------------------------------------------------------
# Automation
# ---------------------------------------------------------------------------

automation = [
    "PyAutoGUI>=0.9.54,<1.0.0",
    "pyperclip>=1.9.0,<2.0.0",
    "Pillow>=10.4.0,<13.0.0",
    "plyer>=2.1.0,<3.0.0",
]


# ---------------------------------------------------------------------------
# External services
# ---------------------------------------------------------------------------

services = [
    "requests>=2.32.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "wikipedia>=1.4.0,<2.0.0",
    "spotipy>=2.24.0,<3.0.0",
]


# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------

database = [
    "SQLAlchemy>=2.0.0,<3.0.0",
    "pydantic>=2.8.0,<3.0.0",
]


# ---------------------------------------------------------------------------
# Development
# ---------------------------------------------------------------------------

dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
]


# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

build = [
    "pyinstaller>=6.10.0,<7.0.0",
]


# ---------------------------------------------------------------------------
# Complete development environment
# ---------------------------------------------------------------------------

all = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
    "pyinstaller>=6.10.0,<7.0.0",
]


# ============================================================================
# 05. COMMAND-LINE ENTRY POINT
# ============================================================================

[project.scripts]

assistantx = "main:main"


# ============================================================================
# 06. SETUPTOOLS
# ============================================================================

[tool.setuptools]

include-package-data = true

zip-safe = false


# ---------------------------------------------------------------------------
# Package discovery
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]

where = ["."]

include = [
    "config*",
    "core*",
    "brain*",
    "ai*",
    "voice*",
    "automation*",
    "services*",
    "dashboard*",
    "database*",
    "plugins*",
]

exclude = [
    "tests*",
    "cache*",
    "logs*",
    "build*",
    "dist*",
]


# ---------------------------------------------------------------------------
# Package data
# ---------------------------------------------------------------------------

[tool.setuptools.package-data]

"*" = [
    "*.json",
    "*.txt",
    "*.md",
    "*.yaml",
    "*.yml",
    "*.toml",
    "*.ini",
]


# ============================================================================
# 07. RUFF
# ============================================================================

[tool.ruff]

target-version = "py310"

line-length = 88

indent-width = 4

exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "cache",
    "logs",
    "__pycache__",
]


# ---------------------------------------------------------------------------
# Ruff lint
# ---------------------------------------------------------------------------

[tool.ruff.lint]

select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "PIE",
    "RET",
    "ARG",
    "PTH",
]

ignore = [
    "E501",
]

fixable = [
    "ALL",
]

unfixable = []


# ---------------------------------------------------------------------------
# Ruff import sorting
# ---------------------------------------------------------------------------

[tool.ruff.lint.isort]

combine-as-imports = true

force-wrap-aliases = true

known-first-party = [
    "config",
    "core",
    "brain",
    "ai",
    "voice",
    "automation",
    "services",
    "dashboard",
    "database",
    "plugins",
]


# ---------------------------------------------------------------------------
# Ruff formatter
# ---------------------------------------------------------------------------

[tool.ruff.format]

quote-style = "double"

indent-style = "space"

line-ending = "auto"

skip-magic-trailing-comma = false


# ============================================================================
# 08. PYTEST
# ============================================================================

[tool.pytest.ini_options]

minversion = "8.0"

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
    "*_test.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "automation: Desktop automation tests",
    "ai: AI provider tests",
    "voice: Voice subsystem tests",
    "slow: Slow-running tests",
]


# ============================================================================
# 09. MYPY
# ============================================================================

[tool.mypy]

python_version = "3.10"

warn_return_any = true

warn_unused_configs = true

warn_redundant_casts = true

warn_unused_ignores = true

disallow_untyped_defs = true

check_untyped_defs = true

no_implicit_optional = true

strict_equality = true

show_error_codes = true

pretty = true

exclude = [
    "^build/",
    "^dist/",
    "^cache/",
    "^logs/",
]


# ============================================================================
# 10. COVERAGE
# ============================================================================

[tool.coverage.run]

branch = true

source = [
    "config",
    "core",
    "brain",
    "ai",
    "voice",
    "automation",
    "services",
    "dashboard",
    "database",
    "plugins",
]


[tool.coverage.report]

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

show_missing = true

skip_covered = true


# ============================================================================
# END OF PYPROJECT CONFIGURATION
# ============================================================================

